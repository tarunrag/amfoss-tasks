<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bull & The Bear - Crypto Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <i class="fa-solid fa-chart-line"></i>
            <h1>Bull & Bear</h1>
        </div>
        <div class="header-controls">
            <input type="text" id="searchInput" placeholder="Search cryptocurrencies...">
            <button id="themeToggle"><i class="fa-solid fa-moon"></i></button>
        </div>
    </header>

    <nav>
        <button id="marketTab" class="active">Market</button>
        <button id="wishlistTab">Wishlist <span id="wishlistCount">(0)</span></button>
    </nav>

    <main>
        <!-- Loading Indicator -->
        <div id="loader" class="loader">Fetching latest data...</div>
        
        <!-- Grid for Crypto Cards -->
        <div id="cryptoGrid" class="crypto-grid"></div>
    </main>

    <!-- Modal for Chart -->
    <div id="chartModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modalCoinTitle">Coin Name</h2>
            <div class="time-filters">
                <button class="time-btn active" data-days="1">24H</button>
                <button class="time-btn" data-days="7">1W</button>
                <button class="time-btn" data-days="30">1M</button>
                <button class="time-btn" data-days="365">1Y</button>
            </div>
            <div class="chart-container">
                <canvas id="coinChart"></canvas>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
